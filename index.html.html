<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de Escalas Tonales - Dayana Ruiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 25px;
            font-size: 18px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Reconocedor de Escalas Tonales</h2>
        <p>Sistema basado en Web Audio API y Web Workers</p>
        
        <button id="btnIniciar">Iniciar Micrófono</button>

        <div class="result-box">
            <p><strong>Frecuencia:</strong> <span id="frecuencia">--</span> Hz</p>
            <p><strong>Nota Musical:</strong> <span id="nota">--</span></p>
            <p><strong>Escala Tonal / Tónica:</strong> <span id="escala">--</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
